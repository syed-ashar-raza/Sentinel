name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Tests
        run: python -m pytest -q
      - name: Security evaluation gate
        run: sentinel evaluate examples/security_cases.json --output sentinel-report.json
      - name: Upload evaluation artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-security-report
          path: sentinel-report.json
