[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sentinel-ai-security"
version = "1.0.0"
description = "Production-oriented AI security and deterministic guardrails platform."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8.0,<10", "ruff>=0.8,<1"]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
